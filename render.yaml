services:
  - type: web
    name: to-do-list-webdev
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn todoproject.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
